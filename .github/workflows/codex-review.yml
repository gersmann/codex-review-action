name: Codex On-Demand Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  comment-review:
    name: Review on /review and /verify comments
    if: >-
      (
        github.event.comment.body == '/review' ||
        github.event.comment.body == '/verify' ||
        startsWith(github.event.comment.body, '/review ') ||
        startsWith(github.event.comment.body, '/review:') ||
        startsWith(github.event.comment.body, '/verify ') ||
        startsWith(github.event.comment.body, '/verify:') ||
        github.event.comment.body == '/codex review' ||
        github.event.comment.body == '/codex verify' ||
        startsWith(github.event.comment.body, '/codex review ') ||
        startsWith(github.event.comment.body, '/codex review:') ||
        startsWith(github.event.comment.body, '/codex verify ') ||
        startsWith(github.event.comment.body, '/codex verify:')
      ) &&
      (
        github.event_name == 'pull_request_review_comment' ||
        github.event.issue.pull_request
      ) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Verify same-repository PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          head_repository=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')
          if [[ "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Comment-triggered reviews are limited to same-repository pull requests"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
      - name: Codex comment-triggered review
        uses: ./
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-luna
          web_search_mode: disabled
          debug_level: 1
